services:
  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airesume-extractor
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - extractor_data:/app/data

    init: true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  extractor_data:
